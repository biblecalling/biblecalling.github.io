name: Validate Jekyll Build

on:
  push:
    branches:
      - feature/phase-1-prayer-hub
      - feature/prayer-navigation-hierarchy
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Jekyll Strict Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install GitHub Pages Dependencies
        run: |
          cat << 'EOF' > Gemfile
          source "https://rubygems.org"
          gem "github-pages", "= 232", group: :jekyll_plugins
          EOF
          bundle install

      - name: Run Jekyll Build
        run: |
          bundle exec jekyll build --trace --strict_front_matter --destination ./_site_test

      - name: Verify Phase 1 Output Pages
        run: |
          test -f ./_site_test/prayer/index.html
          test -f ./_site_test/prayer/prayer-for-a-sick-mother/index.html
          test -f ./_site_test/prayer/prayer-for-anxiety-at-night/index.html
          test -f ./_site_test/prayer/prayer-for-healing-a-loved-one/index.html
          test -f ./_site_test/prayer/prayer-for-peace-of-mind/index.html
          test -f ./_site_test/prayer/prayer-for-protection-of-family/index.html
          test -f ./_site_test/prayer/prayer-for-someone-in-the-hospital/index.html
          test -f ./_site_test/prayer/prayer-for-strength/index.html
          echo "All 8 Phase 1 prayer pages successfully generated by Jekyll!"
