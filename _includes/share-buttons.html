<aside class="share-widget" aria-label="Share this article">
  <span class="share-label">Share This Encouragement:</span>
  <div class="share-buttons-list">
    <!-- Native Share (Mobile / Modern Browsers) -->
    <button type="button" class="share-btn share-native" id="btn-native-share" aria-label="Share via device options" title="Share reflection">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
      <span>Share</span>
    </button>

    <!-- Copy Link -->
    <button type="button" class="share-btn share-copy" id="btn-copy-link" aria-label="Copy article link to clipboard" title="Copy link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span class="copy-text">Copy Link</span>
    </button>

    <!-- Twitter / X -->
    <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ site.url }}{{ site.baseurl }}{{ page.url | url_encode }}"
       target="_blank" rel="noopener noreferrer" class="share-btn share-twitter" aria-label="Share on X (Twitter)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      <span class="sr-only">X</span>
    </a>

    <!-- Facebook -->
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ site.baseurl }}{{ page.url | url_encode }}"
       target="_blank" rel="noopener noreferrer" class="share-btn share-facebook" aria-label="Share on Facebook">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      <span class="sr-only">Facebook</span>
    </a>

    <!-- WhatsApp -->
    <a href="https://api.whatsapp.com/send?text={{ page.title | url_encode }}%20{{ site.url }}{{ site.baseurl }}{{ page.url | url_encode }}"
       target="_blank" rel="noopener noreferrer" class="share-btn share-whatsapp" aria-label="Share via WhatsApp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12.031 0C5.396 0 0 5.396 0 12.031c0 2.124.553 4.195 1.603 6.015L0 24l6.155-1.579c1.761.96 3.754 1.465 5.876 1.465 6.634 0 12.03-5.396 12.03-12.031C24.061 5.396 18.665 0 12.031 0zm0 22.029c-1.848 0-3.655-.497-5.228-1.439l-.375-.223-3.882.998 1.036-3.784-.246-.391C2.344 15.617 1.8 13.858 1.8 12.031c0-5.641 4.59-10.231 10.231-10.231 5.641 0 10.231 4.59 10.231 10.231 0 5.641-4.59 10.229-10.231 10.229zm5.608-7.653c-.308-.154-1.821-.898-2.103-1.001-.282-.103-.487-.154-.692.154-.205.308-.795 1.001-.974 1.206-.179.205-.359.231-.667.077-.308-.154-1.299-.479-2.474-1.527-.914-.815-1.531-1.822-1.711-2.13-.179-.308-.019-.474.135-.627.139-.138.308-.359.462-.538.154-.179.205-.308.308-.513.103-.205.051-.385-.026-.538-.077-.154-.692-1.667-.949-2.282-.25-.6-.503-.519-.692-.529h-.59c-.205 0-.538.077-.821.385-.282.308-1.077 1.051-1.077 2.564s1.103 2.974 1.256 3.179c.154.205 2.17 3.313 5.257 4.646.734.318 1.308.508 1.756.65.739.235 1.411.202 1.942.123.593-.088 1.821-.744 2.077-1.462.256-.718.256-1.333.179-1.462-.077-.128-.282-.205-.59-.359z"/>
      </svg>
      <span class="sr-only">WhatsApp</span>
    </a>

    <!-- Pinterest -->
    <a href="https://pinterest.com/pin/create/button/?url={{ site.url }}{{ site.baseurl }}{{ page.url | url_encode }}&description={{ page.title | url_encode }}{% if page.image %}&media={{ site.url }}{{ site.baseurl }}{{ page.image }}{% endif %}"
       target="_blank" rel="noopener noreferrer" class="share-btn share-pinterest" aria-label="Share on Pinterest">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0a12 12 0 0 0-4.37 23.18c-.06-.94-.12-2.39.03-3.42.13-.93.85-6.17.85-6.17s-.22-.43-.22-1.07c0-1 .58-1.75 1.3-1.75.61 0 .91.46.91 1.01 0 .62-.39 1.54-.6 2.4-.17.72.36 1.31 1.07 1.31 1.28 0 2.27-1.35 2.27-3.3 0-1.73-1.24-2.93-3.02-2.93-2.06 0-3.26 1.54-3.26 3.14 0 .62.24 1.29.54 1.65.06.07.07.13.05.2-.06.24-.19.78-.22.89-.03.14-.11.17-.26.1-1-.46-1.62-1.92-1.62-3.09 0-2.52 1.83-4.83 5.28-4.83 2.77 0 4.93 1.98 4.93 4.62 0 2.75-1.74 4.97-4.15 4.97-.81 0-1.57-.42-1.83-.92l-.5 1.9c-.18.7-.67 1.57-1 2.1A12 12 0 1 0 12 0z"/>
      </svg>
      <span class="sr-only">Pinterest</span>
    </a>
  </div>
  <!-- Copied Toast alert -->
  <div id="copy-toast" class="copy-toast" role="status" aria-live="polite">Link copied to clipboard!</div>
</aside>
