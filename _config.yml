# Jesus Calling - Site Configuration
title: "Jesus Calling"
tagline: "Biblical Encouragement, Prayers & Daily Devotionals"
description: "Find hope, peace, and spiritual encouragement through Jesus Christ. Bible-based devotionals, prayers, scripture reflections, and biblical wisdom for everyday life."
url: "https://biblecalling.github.io"
baseurl: ""

# Legal & Non-Affiliation Disclaimers (Centralized for Rebranding)
disclaimer_footer: "This is an independent Christian devotional website and is not affiliated with, endorsed by, or sponsored by Sarah Young, Thomas Nelson, HarperCollins Christian Publishing, or the official Jesus Calling brand. “Jesus Calling” is a registered trademark of its respective owner. Any references to devotional books are provided for commentary, discussion, and reflection only. For the official Jesus Calling book and resources, please visit the official publisher or brand website."
disclaimer_footer_subline: "An independent Christian devotional website."
disclaimer_about_text: "This website is independently created and operated. It is not the official Jesus Calling website. Our articles are original reflections inspired by Scripture and by the devotional tradition of Jesus Calling by Sarah Young. We encourage readers to purchase the official book to support the author's work."
disclaimer_terms_text: "This is an independent website and is not affiliated with, endorsed by, or sponsored by Sarah Young, Thomas Nelson, HarperCollins Christian Publishing, or the official Jesus Calling brand. 'Jesus Calling' is a registered trademark of its respective owner. Devotional book excerpts are referenced for commentary and reflection only. To purchase the official book, please visit <a href=\"https://www.jesuscalling.com\" rel=\"noopener noreferrer nofollow\" target=\"_blank\">jesuscalling.com</a>."
disclaimer_devotional_note: "Inspired by today's reading in Jesus Calling by Sarah Young. This post is an original reflection, not the book's text."

# Author & Organization Information
author:
  name: "Jesus Calling Editorial Team"
  photo: ""
  url: "/amelia/"
  email: "contact@jesuscalling.github.io"
  bio: "The Jesus Calling Editorial Team is dedicated to sharing Bible-based reflections, prayers, daily devotionals, and Scripture guidance to help believers walk closely with Jesus Christ in everyday life."

# Social / Editorial
twitter_username: "jesuscalling"
github_username: "jesuscalling"
locale: "en_US"

# Permalinks - Clean, Permanent, SEO-Optimized
permalink: /:year/:month/:day/:title/

# Publish future-dated posts (required for October 2026 devotional calendar)
future: true

# Pagination (GitHub Pages safe)
paginate: 10
paginate_path: "/blog/page:num/"

# Markdown and Syntax Highlighting
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Collections & Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Jesus Calling Editorial Team"
      featured: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Newsletter & Contact Integration (Configurable External Endpoints)
# Formspree endpoint (free tier, no server required). To switch to MailerLite, replace with your MailerLite form URL.
newsletter_action: "https://formspree.io/f/xjygyjeq"
contact_form_action: "https://formspree.io/f/xjygyjeq"

