# Jesus Calling - Site Configuration
title: "Jesus Calling"
tagline: "Biblical Encouragement, Prayers & Daily Devotionals"
description: "Find hope, peace, and spiritual encouragement through Jesus Christ. Bible-based devotionals, prayers, scripture reflections, and biblical wisdom for everyday life."
url: "https://jesuscalling.github.io"
baseurl: ""

