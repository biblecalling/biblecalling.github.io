# Author & Organization Information
author:
  name: "Jesus Calling Editorial Team"
  photo: ""
  email: "contact@jesuscalling.github.io"
  bio: "An independent Christian editorial team dedicated to biblical reflection, daily devotional guides, and Christ-centered scripture commentary to encourage your daily walk with Christ."

# Social / Editorial
twitter_username: "jesuscalling"
github_username: "jesuscalling"
locale: "en_US"

# Permalinks - Clean, Permanent, SEO-Optimized
permalink: /:year/:month/:day/:title/

# Pagination (GitHub Pages safe)
paginate: 10
paginate_path: "/blog/page:num/"

# Markdown and Syntax Highlighting
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Collections & Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Jesus Calling Editorial Team"
      featured: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Newsletter & Contact Integration (Configurable External Endpoints)
# Replace with your external provider URL (e.g., Buttondown, Mailchimp, Formspree, Substack)
newsletter_action: ""
contact_form_action: ""

