# Exclude unnecessary files from build
exclude:
  - README.md
  - COMMENT_SYSTEM_SETUP.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .git/
  - .github/
  - .gemini/
  - cloudflare-push-worker/
